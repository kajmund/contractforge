name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests benchmarks

      - name: Tests (no live providers, no network)
        run: pytest -m "not live and not slow" --cov=contractforge --cov-report=term-missing

  offline-smoke:
    name: offline end-to-end smoke (mock provider)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Generate 10 contracts with the deterministic mock provider
        run: |
          contractforge generate --type consulting --count 10 --clauses 8 \
            --difficulty 2 --language sv --provider mock --seed 7 \
            --output /tmp/dataset --json > /tmp/generate.json
          contractforge validate /tmp/dataset --json > /tmp/validate.json
          python - <<'PY'
          import json
          report = json.load(open("/tmp/validate.json"))["report"]
          assert report["status"] == "PASS", report
          assert report["contracts_checked"] == 10, report
          print("offline smoke ok")
          PY
