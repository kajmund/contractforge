[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contractforge"
version = "0.1.0"
description = "Generator for syntetiska avtal och juridiska testdata med verifierbara facit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ContractForge contributors" }]
keywords = ["synthetic-data", "legal", "contracts", "benchmark", "golden-questions"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Software Development :: Testing",
]

# Dependency policy: every runtime dependency must be hard to replace with a
# few lines of stdlib. pydantic validates the machine-readable truth objects,
# httpx is the HTTP boundary to Cerebras, python-docx and reportlab produce
# honest DOCX/PDF artifacts. Everything else is stdlib.
dependencies = [
  "pydantic>=2.6,<3",
  "httpx>=0.27,<1",
  "python-docx>=1.1,<2",
  "reportlab>=4,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
contractforge = "contractforge.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contractforge = [
  "scenarios/definitions/*.json",
  "generation/prompts/*/*.md",
  "generation/prompts/*/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live: hits a real LLM provider; requires credentials and network (skipped by default)",
  "slow: benchmark-scale test, skipped by default",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
